name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  MONGODB_URI: mongodb://localhost:27017
  JWT_SECRET: test-secret-key-for-ci-pipeline-testing-only

jobs:
  lint-and-check:
    name: Lint & Environment Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check environment variables
        run: |
          echo "MONGODB_URI=$MONGODB_URI" > .env
          echo "ACCESS_TOKEN_SECRET=test-secret" >> .env
          echo "ACCESS_TOKEN_EXPIRY=1d" >> .env
          echo "REFRESH_TOKEN_SECRET=test-refresh-secret" >> .env
          echo "REFRESH_TOKEN_EXPIRY=10d" >> .env
          echo "CLOUDINARY_API_NAME=test" >> .env
          echo "CLOUDINARY_API_KEY=test" >> .env
          echo "CLOUDINARY_API_SECRET=test" >> .env
          echo "PORT=4000" >> .env
          echo "CORS_ORIGIN=http://localhost:3000" >> .env
          npm run check-env

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test environment file
        run: |
          echo "MONGODB_URI=mongodb://localhost:27017" > .env
          echo "ACCESS_TOKEN_SECRET=test-secret-minimum-32-chars-long" >> .env
          echo "ACCESS_TOKEN_EXPIRY=1d" >> .env
          echo "REFRESH_TOKEN_SECRET=test-refresh-secret-32-chars" >> .env
          echo "REFRESH_TOKEN_EXPIRY=10d" >> .env
          echo "CLOUDINARY_API_NAME=test" >> .env
          echo "CLOUDINARY_API_KEY=test" >> .env
          echo "CLOUDINARY_API_SECRET=test" >> .env
          echo "PORT=4000" >> .env
          echo "CORS_ORIGIN=http://localhost:3000" >> .env

      - name: Run unit tests
        run: npm run test:unit -- --coverage

      - name: Run integration tests
        run: npm run test:integration

      - name: Check coverage
        run: |
          COVERAGE=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 80%"
            exit 1
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-check, test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create environment file
        run: |
          echo "MONGODB_URI=mongodb://localhost:27017" > .env
          echo "ACCESS_TOKEN_SECRET=test-secret-minimum-32-chars-long" >> .env
          echo "ACCESS_TOKEN_EXPIRY=1d" >> .env
          echo "REFRESH_TOKEN_SECRET=test-refresh-secret-32-chars" >> .env
          echo "REFRESH_TOKEN_EXPIRY=10d" >> .env
          echo "CLOUDINARY_API_NAME=test" >> .env
          echo "CLOUDINARY_API_KEY=test" >> .env
          echo "CLOUDINARY_API_SECRET=test" >> .env
          echo "PORT=4000" >> .env
          echo "CORS_ORIGIN=http://localhost:3000" >> .env

      - name: Build project
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            coverage/
